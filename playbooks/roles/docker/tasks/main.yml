---
- name: install docker & friends
  package:
    name: "{{ item }}"
    state: latest
  become: "{{ privileged_package_install }}"
  when: privileged_package_install | default(true) | bool
  with_items:
    - "docker"
    - "docker-compose"

- name: copy in helpful binaries
  copy:
    src: "files/{{ item }}"
    dest: "~/.local/bin/{{ item }}"
    mode: "0755"
  with_items:
    - "cleanup-docker.sh"

- name: enable the docker service
  become: "{{ privileged_package_install }}"
  when: privileged_package_install | default(true) | bool
  service:
    name: docker
    enabled: true
    state: started

- name: ensure jtmoulia is in docker group
  become: "{{ privileged_package_install }}"
  when: privileged_package_install | default(true) | bool
  user:
    name: "jtmoulia"
    append: yes
    groups: ["docker"]
