---

- name: install git
  become: "{{ privileged_package_install }}"
  when: privileged_package_install | default(true) | bool
  package:
    name: git
    state: latest

- name: symlink in global gitconfig
  file:
    state: "link"
    src: "{{ role_path }}/files/gitconfig"
    dest: "~/.gitconfig"
